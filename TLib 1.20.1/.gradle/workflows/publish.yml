name: Publish Library to Separate Maven Repo

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          path: main-code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x main-code/gradlew

      - name: Build and Publish to Local Directory
        run: |
          cd main-code
          ./gradlew publish
          # Это создаст папку tlib-maven внутри папки main-code


      - name: Checkout Maven Repository
        uses: actions/checkout@v4
        with:
          repository: iMeeTake/tlib-maven
          path: maven-repo
          token: ${{ secrets.MAVEN_TOKEN }}

      - name: Copy published files
        run: |
          # Копируем содержимое, которое создал gradle, в папку второго репозитория
          cp -rv main-code/tlib-maven/* maven-repo/

      - name: Deploy to Maven Repo
        run: |
          cd maven-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Auto-publish: ${{ github.event.head_commit.message }}"
            git push origin main # Проверьте, что в репозитории tlib-maven ветка тоже называется main
          fi